name: Android APK + Cloud Run Mobile Companion Deploy

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile-companion/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy-mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Decode Release Keystore (if configured in Secrets)
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release-keystore.jks
            echo "KEYSTORE_PATH=release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Kotlin Unit Tests, Android Lint & Build Release APK + AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test compileDebugAndroidTestKotlin lintRelease assembleRelease bundleRelease --no-daemon

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMasters-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMasters-Android-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Publish Signed AAB & Metadata to Google Play Store (when Play Console is linked)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            pip install --quiet google-api-python-client google-auth
            python3 scripts/publish_play_store.py \
              --aab android/app/build/outputs/bundle/release/app-release.aab \
              --track internal
            python3 scripts/publish_play_store.py \
              --aab android/app/build/outputs/bundle/release/app-release.aab \
              --track alpha || echo "Alpha track awaiting initial review unlock; internal track updated."
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON secret not set; skipping automatic Play Store publish."
          fi

      - name: Bundle APK into Mobile Companion PWA
        run: |
          mkdir -p mobile-companion/public/download
          cp android/app/build/outputs/apk/release/app-release.apk mobile-companion/public/download/PyMasters.apk

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Mobile Companion PWA + APK Image to Artifact Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: mobile-companion
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/pymasters-mobile
        run: |
          docker build --platform linux/amd64 -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      - name: Deploy Mobile Companion PWA + APK Server to Google Cloud Run
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/pymasters-mobile
        run: |
          gcloud run deploy pymasters-mobile \
            --image "$IMAGE:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-3.5-flash-lite" \
            --quiet

      - name: Prune old pymasters-mobile images (keep newest 2)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          REPO="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/pymasters-mobile"
          gcloud artifacts docker images list "$REPO" \
            --sort-by=~UPDATE_TIME --format='value(version)' \
            | tail -n +3 \
            | while read -r digest; do
                gcloud artifacts docker images delete "$REPO@$digest" --delete-tags --quiet || true
              done
