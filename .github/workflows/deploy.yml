name: Build + roll out to the production VM

on:
  push:
    branches: [main]
  # Pull requests run every gate (unit tests, frontend, Tier-1 scenarios against the built image)
  # but never authenticate to GCP, push an image or touch the VM: those steps are push-only.
  pull_request:
    branches: [main]

# Cost control: pushes land as often as every ~30 min from the automation
# loops. If a new push arrives while an older run is still in test/build,
# the older run is superseded — cancel it and let the newest one deploy.
# (The VM pulls :latest on its own timer, so cancelling a run mid-CI is safe.)
# Pull requests get their own group so they never cancel a production deploy.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-to-cloud-run' || format('pr-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests (pre-deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: pytest
        working-directory: backend
        env:
          JWT_SECRET: ci-gate-secret-long-enough-for-validation-abcdef
        run: python -m pytest -q --tb=short

      - name: live HTTP smoke (boots real uvicorn on temp DB)
        # Catches integration-level regressions like the passlib/bcrypt
        # /register 500 — the kind unit tests can miss because hash_pw works
        # locally but the deployed image's dep tree differs.
        working-directory: backend
        env:
          JWT_SECRET: ci-gate-secret-long-enough-for-validation-abcdef
        run: python tests/live_smoke_community.py

  frontend-test:
    name: Frontend tests (pre-deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: lint gate (runtime-crash rules only — undefined JSX components etc.)
        working-directory: frontend
        run: npm run lint:gate

      - name: vitest
        working-directory: frontend
        run: npm test

      - name: build (catches build-only breakage before the Docker build)
        working-directory: frontend
        run: npm run build

  deploy:
    name: Build image + scenario gate + wait for VM rollout
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'pr' }}/cloud-run-source-deploy/pymasters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation — keyless)
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      # Tier-1 scenario gate (docs/superpowers/specs/2026-11-03-autonomous-scenario-testing-design.md):
      # every route, the four journeys and every module, run against THIS image with the stub tutor.
      # A failure stops the job here, so the image is never pushed and the VM keeps the current one.
      - name: Set up Python 3.11 (scenario runner)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ops/e2e/scenarios/requirements.txt

      - name: Install scenario runner + Chromium
        run: |
          pip install -r ops/e2e/scenarios/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tier-1 scenarios (gate)
        env:
          PM_E2E_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          PM_E2E_PYTHON: python
        run: ops/e2e/run_scenarios.sh tier1

      - name: Upload scenario artifacts (junit, container log)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-tier1-${{ github.sha }}
          path: ops/e2e/out/**
          retention-days: 7

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push --all-tags "$IMAGE"

      - name: Wait for the VM rollout (pymasters-vm pulls :latest every 2 minutes)
        if: github.event_name == 'push'
        # Production moved from Cloud Run to a Compute Engine e2-micro on
        # 2026-10-27 (infra/gce/). Nothing deploys from here: the VM's systemd
        # timer pulls the :latest image pushed above and restarts the app if the
        # digest changed (rolling back on a failed health check). This step just
        # confirms the new build is the one serving pymasters.net.
        run: |
          # Through Cloudflare, the same path visitors take (2026-11-03: the VM's ports 80/443 only accept
          # Cloudflare's ranges now, so probing the bare IP from a GitHub runner no longer works).
          VM=https://pymasters.net/health
          echo "waiting for build ${{ github.sha }} at $VM"
          for i in $(seq 1 45); do
            body=$(curl -s --max-time 15 "$VM" || true)
            if echo "$body" | grep -q '"build":"${{ github.sha }}"'; then
              echo "live via Cloudflare: $body"
              exit 0
            fi
            sleep 20
          done
          echo "build ${{ github.sha }} not live after 15 min — on the VM: journalctl -u pymasters-update -n 50"
          echo "last health body: $body"
          exit 1

      - name: Prune old images from Artifact Registry (keep newest 5)
        if: github.event_name == 'push'
        # Every deploy pushes a ~1GB image tagged with the commit SHA; with the
        # 30-min automation loops this compounds into the largest silent cost
        # line (storage is billed per GB-month, forever). Keep the 5 newest for
        # rollback and delete the rest. Non-fatal: if the deploy SA lacks
        # delete permission, the deploy itself must still succeed.
        continue-on-error: true
        run: |
          REPO="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/pymasters"
          gcloud artifacts docker images list "$REPO" \
            --sort-by=~UPDATE_TIME --format='value(version)' \
            | tail -n +6 \
            | while read -r digest; do
                gcloud artifacts docker images delete "$REPO@$digest" --delete-tags --quiet || true
              done
