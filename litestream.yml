# Litestream config — continuous SQLite replication to GCS.
# Cost-optimized for GCP Always Free tier (5,000 Class A ops/month):
#   - sync-interval: 30m (~1,440 Class A writes/month)
#   - snapshot-interval: 24h (~30 Class A writes/month)
#   - retention-check-interval: 720h (GCS Object Lifecycle deletes >4d objects for $0 / 0 Class A ops)
dbs:
  - path: /app/data/pymasters.db
    replicas:
      - type: gcs
        bucket: pymasters-app-db
        path: vm/pymasters.db
        retention: 96h
        snapshot-interval: 24h
        sync-interval: 30m
        retention-check-interval: 720h
