[versions]
androidGradlePlugin = "9.0.1"
kotlin = "2.1.20"
androidxCore = "1.15.0"
androidxActivity = "1.10.1"
androidxSplashscreen = "1.0.1"
androidxSwiperefresh = "1.1.0"
androidxWebkit = "1.12.1"
androidxBrowser = "1.8.0"
playBilling = "7.1.1"
junit = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefresh" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
play-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "playBilling" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
