<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PyMasters Presenter Card</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-0: #040814;
    --bg-1: #0B132B;
    --surface: rgba(13, 21, 44, 0.90);
    --surface-solid: #0D152C;
    --border: rgba(56, 189, 248, 0.28);
    --gold: #E5BE67;
    --gold-hi: #FDE8A3;
    --sapphire: #38BDF8;
    --sapphire-deep: #1D4ED8;
    --text: #F8FAFC;
    --muted: #94A3B8;
  }
  html, body {
    width: __WIDTH__px;
    height: __HEIGHT__px;
    overflow: hidden;
    font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-0);
    color: var(--text);
  }
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 82% 18%, rgba(56, 189, 248, 0.20), transparent 46%),
      radial-gradient(circle at 14% 88%, rgba(229, 190, 103, 0.14), transparent 42%),
      linear-gradient(145deg, #070E22 0%, #050A18 55%, #03060E 100%);
    overflow: hidden;
  }
  .canvas.has-bg-scene {
    background: #040814;
  }
  .bg-scene-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .bg-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(4, 8, 20, 0.90) 0%, rgba(4, 8, 20, 0.68) 48%, rgba(4, 8, 20, 0.16) 100%);
  }
  .layout-portrait .bg-scrim {
    background: linear-gradient(180deg, rgba(4, 8, 20, 0.55) 0%, rgba(4, 8, 20, 0.20) 36%, rgba(4, 8, 20, 0.92) 72%, rgba(4, 8, 20, 0.98) 100%);
  }
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .top-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #1D4ED8 0%, #38BDF8 55%, #E5BE67 100%);
    z-index: 10;
  }

  /* ── Landscape Layout (1280x720 YouTube Thumbnail / 1200x627 Banner) ── */
  .layout-landscape .inner {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1.18fr 0.82fr;
    gap: 28px;
    padding: 42px 46px 38px 48px;
    align-items: center;
  }
  .layout-landscape.has-bg-scene .inner {
    grid-template-columns: 1.05fr 0.95fr;
  }
  .layout-landscape .copy-col {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 18px;
  }
  .layout-landscape .presenter-col {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Portrait / Square Layout (1080x1350 4:5 / 1080x1080 / 1080x1920) ── */
  .layout-portrait .inner {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 44px 52px 42px 52px;
    gap: 22px;
  }
  .layout-portrait .hero-row {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 28px;
    align-items: center;
  }
  .layout-portrait.fullbody-mode .hero-row {
    grid-template-columns: 1fr 340px;
  }

  /* ── Shared Components ── */
  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .crest-wrap {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }
  .brand-word {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #F8FAFC;
  }
  .brand-word span {
    background: linear-gradient(90deg, #FDE8A3, #E5BE67);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .eyebrow-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(29, 78, 216, 0.24);
    border: 1px solid rgba(56, 189, 248, 0.48);
    color: #BAE6FD;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .eyebrow-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38BDF8;
    box-shadow: 0 0 10px #38BDF8;
  }

  .headline {
    font-size: __HEADLINE_SIZE__px;
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: #F8FAFC;
    text-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);
  }
  .headline .accent {
    color: #FDE8A3;
  }
  .subheadline {
    margin-top: 14px;
    font-size: __SUBHEADLINE_SIZE__px;
    font-weight: 500;
    line-height: 1.38;
    color: #CBD5E1;
  }

  .presenter-frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-height: __PRESENTER_MAX_H__px;
    border-radius: 26px;
    overflow: hidden;
    border: 2px solid rgba(56, 189, 248, 0.55);
    box-shadow:
      0 24px 60px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(229, 190, 103, 0.25) inset;
    background: #0A1328;
  }
  .presenter-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 16%;
    display: block;
  }
  .presenter-tag {
    position: absolute;
    left: 14px;
    bottom: 14px;
    padding: 7px 14px;
    border-radius: 12px;
    background: rgba(6, 11, 25, 0.86);
    border: 1px solid rgba(229, 190, 103, 0.55);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    font-weight: 700;
    color: #FDE8A3;
    letter-spacing: 0.6px;
  }

  .code-card {
    background: rgba(8, 14, 30, 0.94);
    border: 1.5px solid rgba(56, 189, 248, 0.34);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
  }
  .code-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: rgba(15, 25, 52, 0.92);
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  }
  .dots { display: flex; gap: 7px; }
  .dots span { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .dots span:nth-child(1) { background: #FF5F56; }
  .dots span:nth-child(2) { background: #FFBD2E; }
  .dots span:nth-child(3) { background: #27C93F; }
  .code-meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    color: #94A3B8;
  }
  .code-body {
    padding: 18px 22px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: __CODE_SIZE__px;
    line-height: 1.52;
    color: #E2E8F0;
    white-space: pre;
    overflow: hidden;
  }
  .tok-kw { color: #C678DD; font-weight: 600; }
  .tok-fn { color: #61AFEF; }
  .tok-str { color: #98C379; }
  .tok-num { color: #D19A66; }
  .tok-cmt { color: #6E768C; font-style: italic; }
  .tok-bi { color: #56B6C2; }
  .tok-op { color: #38BDF8; }
  .tok-cls { color: #E5C07B; }

  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid rgba(148, 163, 184, 0.22);
    font-size: 17px;
    color: #CBD5E1;
  }
  .footer-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #FDE8A3;
  }
  .footer-stats {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    color: #94A3B8;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="canvas __LAYOUT_CLASS__ __BG_SCENE_CLASS__ __FULLBODY_CLASS__">
    __BG_SCENE_TAG__
    <div class="grid-overlay"></div>
    <div class="top-accent"></div>

    __BODY_MARKUP__
  </div>
</body>
</html>
